name: ZX Lite Messenger CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Run Backend Tests
        working-directory: backend
        run: npm test

  android-build:
    name: Android Build & APK Assembly
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Restore Debug Keystore if Needed
        run: |
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ -f "debug.keystore" ]; then
            echo "debug.keystore is present and ready."
          else
            echo "Warning: debug.keystore not found, Gradle will generate default."
          fi

      - name: Run Local JVM Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Android APK
        id: assemble-apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # If custom release signing keystore is supplied in GitHub Secrets, decode and assemble release
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Signing secrets detected. Building signed Release APK..."
            echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            export KEYSTORE_PATH="${GITHUB_WORKSPACE}/my-upload-key.jks"
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
            RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            echo "No custom release keystore secret found. Building installable test Debug APK..."
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
            RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "::error::Gradle did not produce an APK file!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$RAW_APK" 2>/dev/null || stat -f%z "$RAW_APK")
          echo "Built APK located at: $RAW_APK"
          echo "Raw APK Size: $FILE_SIZE bytes"

          # Verify APK exists and has non-zero size (must be >= 1MB for Android Compose app)
          if [ "$FILE_SIZE" -lt 1048576 ]; then
            echo "::error::Generated APK size ($FILE_SIZE bytes) is suspiciously small or empty!"
            exit 1
          fi

          # Standardize output asset name to 'ZX-Lite-Messenger.apk'
          mkdir -p build-artifacts
          cp "$RAW_APK" "build-artifacts/ZX-Lite-Messenger.apk"

          STANDARDIZED_SIZE=$(stat -c%s "build-artifacts/ZX-Lite-Messenger.apk" 2>/dev/null || stat -f%z "build-artifacts/ZX-Lite-Messenger.apk")
          echo "Standardized APK ready at build-artifacts/ZX-Lite-Messenger.apk ($STANDARDIZED_SIZE bytes)"
          echo "apk_path=build-artifacts/ZX-Lite-Messenger.apk" >> $GITHUB_OUTPUT
          echo "apk_size=$STANDARDIZED_SIZE" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZX-Lite-Messenger-APK
          path: build-artifacts/ZX-Lite-Messenger.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release (Tagged Builds Only)
    needs: [android-build, backend-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Built APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: ZX-Lite-Messenger-APK
          path: ./release-apk

      - name: Verify Downloaded Release Asset
        run: |
          ASSET_FILE="./release-apk/ZX-Lite-Messenger.apk"
          if [ ! -f "$ASSET_FILE" ]; then
            echo "::error::Expected release asset $ASSET_FILE was not downloaded!"
            exit 1
          fi
          SIZE=$(stat -c%s "$ASSET_FILE" 2>/dev/null || stat -f%z "$ASSET_FILE")
          if [ "$SIZE" -lt 1048576 ]; then
            echo "::error::Asset file size ($SIZE bytes) is invalid or empty!"
            exit 1
          fi
          echo "Release asset ZX-Lite-Messenger.apk verified ($SIZE bytes)."

      - name: Publish GitHub Release with APK Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-apk/ZX-Lite-Messenger.apk
          name: ZX Lite Messenger ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ZX Lite Messenger — Release ${{ github.ref_name }}
            **Developer:** ZUCCHERO XANN  
            **Focus:** Ultra-low RAM, minimal data consumption, and reliable realtime messaging.

            ### APK Direct Download
            Direct download link for this release:
            - **File Name:** `ZX-Lite-Messenger.apk`
            - **Direct Download URL:** https://github.com/${{ github.repository }}/releases/latest/download/ZX-Lite-Messenger.apk

            ### Compatibility & Installation
            - Android 7.0+ (API level 24+)
            - Architecture: Universal (ARM64, ARMv7, x86_64)
            - Can be sideloaded and installed directly on physical Android smartphones and emulators.
