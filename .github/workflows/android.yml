name: ZX Lite Messenger CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Run Backend Tests
        working-directory: backend
        run: npm test

  android-build:
    name: Android Build & APK Assembly
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || true

      - name: Run Local JVM Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK Exists and Validate File Size
        id: verify-apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file was not found in app/build/outputs/apk/debug"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "Found APK at: $APK_PATH"
          echo "APK Size: $FILE_SIZE bytes"
          
          # Verify APK is larger than 1MB (1048576 bytes)
          if [ "$FILE_SIZE" -lt 1048576 ]; then
            echo "ERROR: Generated APK size ($FILE_SIZE bytes) is suspiciously small!"
            exit 1
          fi
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zx-lite-messenger-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    name: Publish GitHub Release (Tagged Builds Only)
    needs: [android-build, backend-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Built APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: zx-lite-messenger-debug-apk
          path: ./release-apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-apk/*.apk
          name: ZX Lite Messenger ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## ZX Lite Messenger — Release ${{ github.ref_name }}
            **Branding**: ZUCCHERO XANN
            **Focus**: Low RAM, Low Data, Real-time Native Android Chat

            ### Release Assets
            - Standalone APK attached below.
            - Compatible with Android 7.0+ (API 24+).
