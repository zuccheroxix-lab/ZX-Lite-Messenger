services:
  postgres:
    image: postgres:16-alpine
    container_name: zx_lite_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zx_secure_postgres_pass
      POSTGRES_DB: zxlite_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zx_lite_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:zx_secure_postgres_pass@postgres:5432/zxlite_db
      JWT_SECRET: zx_lite_master_production_jwt_secret_token_key_change_me
    ports:
      - "3000:3000"

volumes:
  pgdata:
